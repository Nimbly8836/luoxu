openapi: 3.1.0
info:
  title: Luoxu API
  version: 1.0.0
  description: >-
    Telegram message archive search, authentication, context, and
    administration API.
servers:
  - url: /luoxu
security: []
paths:
  /auth/login:
    post:
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Access and refresh tokens
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Rotate a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: New token pair
        '401':
          description: Invalid refresh token
  /auth/me:
    get:
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
        '401':
          description: Authentication required
  /auth/sessions/revoke:
    post:
      summary: Revoke all refresh sessions for the current user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sessions revoked
        '401':
          description: Authentication required
  /groups:
    get:
      summary: List accessible legacy groups
      responses:
        '200':
          description: Groups visible to the current identity
  /conversations:
    get:
      summary: List accessible conversations
      responses:
        '200':
          description: Groups, topics, and authorized private chats
  /search:
    get:
      summary: Search current non-deleted message state
      parameters:
        - name: g
          in: query
          schema:
            type: integer
            format: int64
        - name: conversation_id
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
        - name: sender
          in: query
          schema:
            type: string
            example: 123,456
        - name: start
          in: query
          schema:
            type: integer
        - name: end
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Search result
        '404':
          description: Conversation not accessible
  /names:
    get:
      summary: Search sender names in accessible groups
      parameters:
        - name: g
          in: query
          schema:
            type: integer
            format: int64
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching names
  /conversations/{conversation_id}/messages/{message_id}:
    get:
      summary: Get a message
      parameters:
        - $ref: '#/components/parameters/conversation_id'
        - $ref: '#/components/parameters/message_id'
      responses:
        '200':
          description: Message or deleted marker
        '404':
          description: Not found or not accessible
  /context:
    get:
      summary: Get message context by legacy group and message IDs
      description: >-
        Compatibility entry point for group messages, including forum topics.
        Resolves the locally archived message and applies access control to its
        actual conversation. Returns the same target, before, after, replies,
        and replies_meta as the UUID endpoint. Replies include full archived
        originals, later replies and parallel branches rooted at earlier
        originals, independently of search hits and the chronological window.
        Only authorized local messages on the same Telegram peer are traversed;
        never fetches from Telegram. Completeness is local, not a claim about
        Telegram history.
      parameters:
        - name: g
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: id
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
        - $ref: '#/components/parameters/context_before'
        - $ref: '#/components/parameters/context_after'
        - $ref: '#/components/parameters/reply_depth'
        - $ref: '#/components/parameters/reply_limit'
      responses:
        '200':
          $ref: '#/components/responses/MessageContext'
        '400':
          description: Missing or invalid query parameters
        '404':
          description: Message not locally archived or not accessible
  /conversations/{conversation_id}/messages/{message_id}/context:
    get:
      summary: Get surrounding messages and the accessible local discussion
      description: >-
        Same behavior as the legacy context endpoint. Walks earlier originals,
        then expands descendants from the target and ancestor spine, including
        parallel branches. Full archived originals need not match a search or
        occur in the before/after window. Uses current permissions, never
        Telegram.
        Check replies_meta for truncation and unavailable or deleted content.
      parameters:
        - $ref: '#/components/parameters/conversation_id'
        - $ref: '#/components/parameters/message_id'
        - $ref: '#/components/parameters/context_before'
        - $ref: '#/components/parameters/context_after'
        - $ref: '#/components/parameters/reply_depth'
        - $ref: '#/components/parameters/reply_limit'
      responses:
        '200':
          $ref: '#/components/responses/MessageContext'
        '400':
          description: Invalid parameters or excessive combined window
        '404':
          description: Not found or not accessible
  /conversations/{conversation_id}/messages/{message_id}/history:
    get:
      summary: Get edit and delete snapshots
      parameters:
        - $ref: '#/components/parameters/conversation_id'
        - $ref: '#/components/parameters/message_id'
        - name: include_history
          in: query
          required: true
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Historical snapshots
        '404':
          description: History disabled, unavailable, or inaccessible
  /docs:
    get:
      summary: Swagger UI
      responses:
        '200':
          description: Public API documentation UI
  /openapi.yaml:
    get:
      summary: OpenAPI document
      responses:
        '200':
          description: OpenAPI 3.1 document
  /avatar/{uid}.jpg:
    get:
      summary: Get an avatar for a sender visible to the current identity
      description: >-
        Checks access before every cache hit. User-to-avatar metadata is cached
        in-process for 5 minutes; expired entries serve the existing image while
        refreshing. Cold requests wait at most 3 seconds, then return a local
        default while the shared per-user load continues in the background.
        Background queue/lookup/download work has a separate 30-second deadline,
        at most 4 active workers and 128 active or queued tasks. Only failed
        background loads back off for 30 seconds. After loading completes, a new
        request is needed to see the photo; returned placeholders do not update
        automatically. Missing photos return the default image and deleted users
        the ghost image, without a redirect. Responses are private and no-store.
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Avatar image or local placeholder
          headers:
            X-Luoxu-Avatar-Status:
              description: >-
                ready means an image is available; pending means loading or
                refreshing; missing means no photo; deleted means deleted user;
                unavailable means failed loading, a full queue, or shutdown.
              schema:
                type: string
                enum: [ready, pending, missing, deleted, unavailable]
        '404':
          description: Sender is not visible to the current identity
  /avatar/{name}.jpg:
    get:
      summary: Get a default or deleted-user avatar
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [nobody, ghost]
      responses:
        '200':
          description: Avatar image
  /admin/groups:
    get:
      summary: List canonical groups with positive monitoring references
      description: >-
        Administrator only. Persisted requested monitoring, not a guarantee that
        Telegram collection is running. Runtime is local; web-only reports
        unknown. The all-archive list remains /admin/conversations.
        Response is private, no-store.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Groups with one or more manual/account/public references
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminConversation'
        '401':
          description: Authentication required
        '403':
          description: Administrator required
    post:
      summary: Start monitoring a group or return an already monitored group
      description: >-
        Administrator only. Monitoring does not publish the archive or grant
        user access. Returns the canonical conversation UUID for later grants.
        Requires a running indexer with the group-monitoring callback; web-only
        mode returns 503. Saves a durable manual reference and reuses the
        existing archive on re-enable. Restarts restore persisted references.
        Configuration
        telegram.index_groups is imported only once and cannot resurrect stopped
        manual references. Collection failures retain requested state for retry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group:
                  description: Nonempty Telegram group reference or numeric ID
                  oneOf:
                    - type: string
                      minLength: 1
                      examples: ['-1001234567890']
                    - type: integer
                      format: int64
      responses:
        '201':
          description: Monitored conversation, without changing existing grants
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    $ref: '#/components/schemas/AdminConversation'
        '400':
          description: Invalid group request
        '401':
          description: Authentication required
        '403':
          description: Administrator required
        '503':
          description: Monitoring or conversation metadata is unavailable
  /admin/groups/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/conversation_id'
    put:
      summary: Enable the manual monitoring reference for an archived group
      description: >-
        Does not grant or publish content. Canonical parent group UUID only.
        Web-only can persist this change; a running indexer reconciles it later.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Manual reference enabled idempotently
        '400':
          description: Invalid UUID
        '401':
          description: Authentication required
        '403':
          description: Administrator required
        '404':
          description: Canonical group not found
    delete:
      summary: Disable only the manual monitoring reference
      description: >-
        Individual and public grants on the group or its topics continue to keep
        collection requested. Last-reference removal stops live handlers/history
        but retains messages, revisions, UUID and saved history progress.
        Does not revoke access grants. Web-only changes are reconciled
        by an indexer.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Manual reference disabled idempotently
        '400':
          description: Invalid UUID
        '401':
          description: Authentication required
        '403':
          description: Administrator required
        '404':
          description: Canonical group not found
  /admin/conversations:
    get:
      summary: List all conversations for permission management
      description: >-
        Management list, not the current user's content access list. is_public
        reflects effective anonymous access, including inherited public topics.
        Telegram pub_id is a username and must not be used as an access flag.
        Includes stopped archives. Groups and topics report their underlying
        group's references and local runtime; private chats omit monitoring.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Administrator-only conversation list
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminConversation'
        '401':
          description: Authentication required
        '403':
          description: Administrator required
  /admin/public:
    get:
      summary: List explicit public conversation grants
      description: >-
        All signed-in users inherit public access. Inherited topic access
        need not have a separate explicit topic grant in this list.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Conversations with explicit anonymous pub grants
        '401':
          description: Authentication required
        '403':
          description: Administrator required
  /admin/users/{user_id}/grants:
    parameters:
      - $ref: '#/components/parameters/user_id'
    get:
      summary: List a user's explicit conversation grants
      description: Does not include inherited public or parent-group access.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Explicitly granted conversations
        '401':
          description: Authentication required
        '403':
          description: Administrator required
        '404':
          description: User not found
  /admin/users:
    get:
      summary: List users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Administrator-only user list
        '403':
          description: Administrator required
    post:
      summary: Create a user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, maxLength: 64}
                password: {type: string, format: password, minLength: 8}
                is_admin: {type: boolean, default: false}
      responses:
        '201':
          description: User created
        '403':
          description: Administrator required
  /admin/users/{user_id}:
    patch:
      summary: Update, disable, or reset a user
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, format: password, minLength: 8}
                is_active: {type: boolean}
                is_admin: {type: boolean}
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Updated user
        '403':
          description: Administrator required
    delete:
      summary: Delete a user
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
  /admin/users/{user_id}/grants/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/user_id'
      - $ref: '#/components/parameters/conversation_id'
    put:
      summary: Grant a user conversation access
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Granted
    delete:
      summary: Revoke a user conversation grant
      description: >-
        Public and inherited parent-group grants may still allow access.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Revoked
  /admin/public/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/conversation_id'
    post:
      summary: Add a conversation to anonymous pub access
      description: >-
        Grants anonymous and all authenticated users access.
        Private chats are rejected.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Granted
    delete:
      summary: Remove anonymous pub access
      description: >-
        Does not revoke individual user grants or delete archived messages.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Revoked
  /admin/users/{user_id}/sessions/revoke:
    post:
      summary: Revoke all refresh sessions for a user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Revoked
components:
  responses:
    MessageContext:
      description: Bounded local discussion with explicit completeness metadata
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageContext'
  schemas:
    ArchivedMessage:
      type: object
      required: [conversation_id, id, text, html, deleted, reply_to_id]
      properties:
        conversation_id: {type: string, format: uuid}
        id: {type: integer, format: int64}
        text:
          type: [string, 'null']
          description: >-
            Full archived text, not just the quoted excerpt; null if deleted
        html: {type: [string, 'null']}
        deleted: {type: boolean}
        reply_to_id: {type: [integer, 'null'], format: int64}
        quote_text: {type: [string, 'null']}
    UnavailableReply:
      type: object
      additionalProperties: false
      required: [msgid, status]
      properties:
        msgid: {type: integer, format: int64}
        status: {type: string, enum: [unavailable]}
    RepliesMeta:
      type: object
      required:
        - scope
        - complete
        - truncated
        - unavailable_count
        - deleted_count
        - depth
        - limit
      properties:
        scope: {type: string, enum: [accessible_local_archive]}
        complete:
          type: boolean
          description: >-
            No truncation, unavailable placeholders or deleted content in target
            plus replies. Never asserts completeness of Telegram history.
        truncated:
          type: boolean
          description: >-
            Limits omitted a known reference or accessible branch.
            Hidden branches are not counted or disclosed.
        unavailable_count: {type: integer, minimum: 0}
        deleted_count:
          type: integer
          minimum: 0
          description: >-
            Counts target plus replies, not unrelated before/after neighbors
        depth: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 0}
    MessageContext:
      type: object
      required: [target, before, after, replies, replies_meta]
      properties:
        target:
          $ref: '#/components/schemas/ArchivedMessage'
        before:
          type: array
          items:
            $ref: '#/components/schemas/ArchivedMessage'
        after:
          type: array
          items:
            $ref: '#/components/schemas/ArchivedMessage'
        replies:
          type: array
          description: >-
            Ancestors nearest-to-oldest, then descendants breadth-first by ID
            from the target and ancestor spine. Includes parallel branches;
            target excluded and IDs deduplicated. Build trees using reply_to_id.
          items:
            oneOf:
              - $ref: '#/components/schemas/ArchivedMessage'
              - $ref: '#/components/schemas/UnavailableReply'
        replies_meta:
          $ref: '#/components/schemas/RepliesMeta'
    GroupMonitoring:
      type: object
      required:
        - requested
        - manual
        - account_references
        - public_references
        - reference_count
        - runtime
      properties:
        requested: {type: boolean}
        manual: {type: boolean}
        account_references:
          type: integer
          minimum: 0
          description: Explicit grant edges on group/topics, not distinct users
        public_references: {type: integer, minimum: 0}
        reference_count:
          type: integer
          minimum: 0
          description: Manual (0 or 1) plus account and public references
        runtime:
          type: object
          required: [state, error_type]
          properties:
            state:
              type: string
              enum:
                - unknown
                - pending
                - starting
                - running
                - retrying
                - stopping
                - stopped
              description: >-
                Local observation; running does not mean history is complete
            error_type: {type: [string, 'null']}
    AdminConversation:
      type: object
      required:
        - id
        - kind
        - name
        - telegram_peer_type
        - telegram_peer_id
        - topic_id
        - pub_id
        - legacy_group_id
        - is_public
      properties:
        monitoring:
          $ref: '#/components/schemas/GroupMonitoring'
        id:
          type: string
          format: uuid
          description: Conversation UUID used in access-grant APIs
        kind:
          type: string
          enum: [group, topic, private_chat]
        name:
          type: string
        telegram_peer_type:
          type: string
          enum: [chat, channel, user]
        telegram_peer_id:
          type: integer
          format: int64
        topic_id:
          type: [integer, 'null']
          format: int64
        pub_id:
          type: [string, 'null']
          description: >-
            Telegram public username, not a Luoxu access-permission flag
        legacy_group_id:
          type: [integer, 'null']
          format: int64
        is_public:
          type: boolean
          readOnly: true
          description: >-
            Effective anonymous access, including inherited public group topics
  parameters:
    context_before:
      name: before
      in: query
      description: >-
        Clamped to context.before; combined window is bounded by max_window.
      schema: {type: integer, minimum: 0, default: 5}
    context_after:
      name: after
      in: query
      description: >-
        Clamped to context.after; these are neighbors, not necessarily replies.
      schema: {type: integer, minimum: 0, default: 5}
    reply_depth:
      name: depth
      in: query
      description: >-
        Clamped to context.reply_depth. Ancestor hops, then descendant layers
        from the target and ancestor spine, not a shared graph-distance budget.
      schema: {type: integer, minimum: 0, default: 5}
    reply_limit:
      name: reply_limit
      in: query
      description: >-
        Clamped to context.reply_limit. Maximum replies including unavailable
        placeholders; excludes target and chronological neighbors.
        Zero is allowed.
      schema: {type: integer, minimum: 0, default: 100}
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    conversation_id:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    message_id:
      name: message_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
