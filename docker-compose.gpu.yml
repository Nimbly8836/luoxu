services:
  ocr:
    build:
      context: ./docker/ocr
      dockerfile: Dockerfile
      target: gpu-final
    image: luoxu-ocr:gpu-3.2.2-cuda12.6
    environment:
      PADDLEOCR_DEVICE: gpu:0
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
